apiVersion: v1
kind: Service
metadata:
  name: my-web-app-service
spec:
  type: NodePort # Expose the app on a specific port
  selector:
    app: my-web-app
  ports:
    - port: 80 # Port the service listens on
      targetPort: 5000 # Port the app listens on
      nodePort: 30007 # Port accessible on your machine (range: 30000-32767)
